name: 8C-1I ArBanking Intent Transform Dry Run

on:
  push:
    branches:
      - feat/checkpoint-8c1i-arbanking-intent-dry-run
    paths:
      - scripts/processing/transform_arbanking_intent_subset.py
      - .github/workflows/dry-run-arbanking-intent-transform.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned transform dependency
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0

      - name: Transform duplicate-bearing ArBanking subset and validate
        run: |
          python scripts/processing/transform_arbanking_intent_subset.py \
            --source "data/Banking77_Arabized_Saudi_test.csv" \
            --output-parquet "$RUNNER_TEMP/arbanking_intent_subset.parquet" \
            --manifest "$RUNNER_TEMP/arbanking_intent_dry_run_manifest.json"
          python -m json.tool "$RUNNER_TEMP/arbanking_intent_dry_run_manifest.json" >/dev/null
          test -s "$RUNNER_TEMP/arbanking_intent_subset.parquet"

      - name: Enforce payload-free evidence and duplicate preservation
        run: |
          ! grep -q '"raw_text"' "$RUNNER_TEMP/arbanking_intent_dry_run_manifest.json"
          ! grep -q '"source_intent"' "$RUNNER_TEMP/arbanking_intent_dry_run_manifest.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("arbanking_intent_dry_run_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert manifest["canonical_row_count"] == 8
          assert manifest["selected_duplicate_group_count"] == 3
          assert manifest["selected_duplicate_excess_row_count"] == 3
          assert manifest["checks"]["no_silent_deduplication"] is True
          PY

      - name: Upload validation manifest only
        uses: actions/upload-artifact@v4
        with:
          name: arbanking-intent-transform-dry-run-manifest
          path: ${{ runner.temp }}/arbanking_intent_dry_run_manifest.json
          retention-days: 14
          if-no-files-found: error
