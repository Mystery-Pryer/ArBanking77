name: 9B ArBanking Full Corpus Encrypted Handoff

on:
  push:
    branches:
      - feat/checkpoint-9b-arbanking-full-corpus
    paths:
      - scripts/processing/transform_arbanking_full_corpus.py
      - ci/arbanking9b_public.pem
      - .github/workflows/checkpoint-9b-arbanking-full-corpus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned transform dependency
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0

      - name: Verify exact source Git blob
        run: |
          test "$(git hash-object data/Banking77_full_corpus.csv)" = "3434fe0f9ef7d4797e40840b0ef1b4862ffcb08b"

      - name: Audit aggregate source counts
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          p = Path("data/Banking77_full_corpus.csv")
          fields = [
              "Intent_ID","Intent_en","Intent_ar","QID","Question_en",
              "QuestionID_MSA1","Question_MSA1","QuestionID_MSA2","Question_MSA2",
              "QuestionID_PAL1","Question_PAL1","QuestionID_PAL2","Question_PAL2"
          ]
          rows = []
          extras = 0
          with p.open("r", encoding="utf-8-sig", newline="") as f:
              rd = csv.DictReader(f)
              assert rd.fieldnames == fields, rd.fieldnames
              for row in rd:
                  if None in row:
                      extras += 1
                  rows.append(row)

          qids = [row["QID"] for row in rows]
          malformed = [
              {
                  "physical_record_ordinal": i,
                  "qid": row.get("QID"),
                  "extra_column_count": len(row.get(None) or []),
              }
              for i, row in enumerate(rows, start=1)
              if None in row
          ]
          result = {
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "bytes": p.stat().st_size,
              "rows": len(rows),
              "malformed_records": malformed,
              "exact_unique_rows": len({
                  tuple(row.get(k) for k in fields) for row in rows
              }),
              "rows_with_extra_columns": extras,
              "unique": {
                  k: len({row.get(k) for row in rows}) for k in fields
              },
              "blank_counts": {
                  k: sum(1 for row in rows if row.get(k) in (None, ""))
                  for k in fields
              },
              "qid_duplicate_excess": len(qids) - len(set(qids)),
              "qid_min": min(map(int, qids)),
              "qid_max": max(map(int, qids)),
          }
          print("SOURCE_AUDIT_JSON=" + json.dumps(
              result, ensure_ascii=False, sort_keys=True
          ))
          PY

      - name: Execute and validate 52300-row full-corpus transform
        run: |
          python scripts/processing/transform_arbanking_full_corpus.py \
            --source "data/Banking77_full_corpus.csv" \
            --output-parquet "$RUNNER_TEMP/arbanking77_full_corpus_intent_utterances.parquet" \
            --manifest "$RUNNER_TEMP/arbanking77_full_corpus_manifest.json"
          python -m json.tool "$RUNNER_TEMP/arbanking77_full_corpus_manifest.json" >/dev/null
          test -s "$RUNNER_TEMP/arbanking77_full_corpus_intent_utterances.parquet"

      - name: Enforce payload-free manifest
        run: |
          ! grep -q '"raw_text"' "$RUNNER_TEMP/arbanking77_full_corpus_manifest.json"
          ! grep -q '"english_translation"' "$RUNNER_TEMP/arbanking77_full_corpus_manifest.json"
          ! grep -q '"source_intent_en"' "$RUNNER_TEMP/arbanking77_full_corpus_manifest.json"
          ! grep -q '"source_intent_ar"' "$RUNNER_TEMP/arbanking77_full_corpus_manifest.json"

      - name: Encrypt canonical Parquet for private handoff
        run: |
          openssl rand -out "$RUNNER_TEMP/aes_key.bin" 32
          openssl rand -out "$RUNNER_TEMP/aes_iv.bin" 16
          KEY_HEX="$(xxd -p -c 256 "$RUNNER_TEMP/aes_key.bin")"
          IV_HEX="$(xxd -p -c 256 "$RUNNER_TEMP/aes_iv.bin")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" \
            -in "$RUNNER_TEMP/arbanking77_full_corpus_intent_utterances.parquet" \
            -out "$RUNNER_TEMP/arbanking77_full_corpus_intent_utterances.parquet.enc"
          cat "$RUNNER_TEMP/aes_key.bin" "$RUNNER_TEMP/aes_iv.bin" > "$RUNNER_TEMP/envelope.bin"
          openssl pkeyutl -encrypt -pubin \
            -inkey ci/arbanking9b_public.pem \
            -in "$RUNNER_TEMP/envelope.bin" \
            -out "$RUNNER_TEMP/envelope.bin.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f "$RUNNER_TEMP/arbanking77_full_corpus_intent_utterances.parquet" \
                "$RUNNER_TEMP/aes_key.bin" "$RUNNER_TEMP/aes_iv.bin" "$RUNNER_TEMP/envelope.bin"

      - name: Upload encrypted canonical handoff and payload-free manifest
        uses: actions/upload-artifact@v4
        with:
          name: arbanking77-full-corpus-encrypted-handoff
          path: |
            ${{ runner.temp }}/arbanking77_full_corpus_intent_utterances.parquet.enc
            ${{ runner.temp }}/envelope.bin.enc
            ${{ runner.temp }}/arbanking77_full_corpus_manifest.json
          retention-days: 1
          if-no-files-found: error
